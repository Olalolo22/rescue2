[package]
name = "rescue-protocol"
version = "0.1.0"
description = "Rescue Protocol: Ephemeral Competitive Liquidation-Intervention Layer"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rescue_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "access-control"] }
pyth-solana-receiver-sdk = "=2.0.0"
